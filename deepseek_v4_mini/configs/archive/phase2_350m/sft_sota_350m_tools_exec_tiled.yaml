# sft_sota_350m_tools_exec_TILED — = ..._fast.yaml + PAVAGE de la fenêtre TBPTT
# et DÉCOUPAGE des tours longs. Remplace `_fast`, qui a tourné ~65 steps.
#
# POURQUOI CE RUN REMPLACE `_fast`. La banque est détachée à chaque pull, donc
# `slots` EST la fenêtre TBPTT. Avec le refill naïf, une lane se recharge
# n'importe où dans la fenêtre : ~1 session sur 3 est coupée par la frontière de
# pull et ses tours tardifs perdent le gradient vers ses écritures précoces. Un
# couple d'âge `a` ne survit qu'avec probabilité `max(0, 1-a/32)` :
#
#   âge write→réponse    1      6 (médian)   12 (p90)   22 (max)
#   `_fast`            96,9 %     81,2 %      62,5 %     31,2 %
#   ce run              100 %      100 %       100 %      100 %
#
# Autrement dit `_fast` sous-entraînait EXACTEMENT le régime que ce run existe
# pour apprendre — la marche 2 (répondre depuis un write ancien), celle que le
# diagnostic de `tools_exec` v1 accusait. Proposition user 2026-07-25 :
# bucketter les sessions par nombre de segs et composer chaque lane comme une
# somme EXACTE de sessions entières (8+8+16, 4+4+24…). C'est l'analogue chat de
# `pack_convs` (profondeur constante par pull) ; `convs_per_session` chaînait
# déjà les convs mais sans les aligner sur la frontière, c'était la moitié
# manquante. Rien n'est fusionné : un seg reste un write, la distance
# write→réponse est intacte, chaque lane reste une vie de banque indépendante.
#
# `chat.gen.tile: true` + `pool: 16`. Le pool est AUTO-CROISSANT et c'est
# nécessaire : le subset-sum consomme préférentiellement les petites sessions,
# donc un pool fixe dérive vers les grandes et cesse de tomber juste — mesuré
# sur ce mix, 30 % d'échecs à pool 16 fixe, 21 % à 32, 11 % à 64, 0 % à 128.
# Avec la croissance : 0 session coupée sur 160 remplissages, quelle que soit la
# taille de départ, et le pool converge vers la même composition.
# Le pool est de l'état que le rng NE reconstruit PAS ⇒ `chat_batch.state_dict()`
# est sauvé dans le ckpt (`chat_stream_state`), sinon le resume repart au milieu
# d'une autre session.
#
# `chat.gen.max_seg_tok: 512` — un tour de plus de 512 tokens devient plusieurs
# segs, donc plusieurs écritures (comme un doc devient plusieurs chunks côté
# fichiers). Décision user : on DÉCOUPE, on ne jette pas les convs concernées —
# les tours longs SONT les cas exec/tool (bloc de code, schéma d'outil), les
# jeter biaiserait la distribution contre le régime visé. Mesuré : longueur de
# tour médiane 88, p99 305, max 996 ⇒ le cap ne touche que <1 % des tours, et
# il fait tomber le pire slot de ~1000 à 512 tokens. Or c'est le PIRE SLOT qui
# fixe le pic VRAM : `_fast` montait à 22,6 G sur 24 par cliquet (10,4 → 15,0 →
# 16,9 → 18,1 → 19,7 → 20,3 → 22,6), soit 1,4 Go de marge. Contrepartie exacte
# du découpage : la CE se décale à l'intérieur d'un seg, donc chaque frontière
# coûte UN token supervisé (1 sur 996) — même prix que les frontières de chunk.
#
# Le reste est identique à `_fast` :
#
# Données, schedule et teacher = ceux du run `near` (sota .5 / tools .25 /
# exec .25, p_near 0.5, β=1 [0,150] + rampe [150,300]) au décalage WSD près :
# **wsd_decay_start 600** et non 300 (décision user 2026-07-25) — 300 steps de
# croisière à LR plein APRÈS la fin de l'anneal teacher, là où la recette rearm
# entamait le decay pile à la sortie de la rampe. Deux autres choses changent,
# et une seule est scientifique :
#
#   1. LE POINT DE DÉPART (décision user 2026-07-25). init_from n'est plus
#      `v350_sft_persona_sif_repass_rearm/step_550.pt` mais la base phase 1
#      SIF `v350_sif_repass/final_step2500.pt`. Motif : avoir une COMPARAISON
#      — les runs `tools_exec` (500 steps) et `near` (300 steps) partent tous
#      deux du canal read transféré du persona, dont le 07-24 avait constaté
#      qu'il « ne s'approfondit pas sur data réelle » (Δnll plat +0.05).
#      Ce run est le bras « base propre », schedule identique.
#      Les deux ckpts ont un `cfg` STRICTEMENT identique (653 tenseurs, zéro
#      clé divergente) : l'échange d'init ne touche à rien d'autre.
#      ⚠️ À ASSUMER : cette base n'a jamais vu de ChatML — le registre n'est
#      pas payé, et il se paie ici SOUS teacher (β=1 dès le step 1). La
#      variante à deux étages du 07-24 (`sft_sota_fromsif_reg.yaml` : 150
#      steps teacher-off d'abord) a été écartée par l'utilisateur au profit
#      d'un run unique. Si `chat` stagne au-delà de ~step 100, c'est là qu'il
#      faut regarder.
#   2. LE COÛT DU STEP, détaillé ci-dessous. Aucune conséquence sur la science
#      hormis la taille du step (voir l'avertissement chunks/step).
#
# CE QUI CHANGE, ET CE QUE ÇA A COÛTÉ (mesuré 2026-07-25 sur la 3090, mêmes
# seed/données, s/step cumulatif à step 6, normalisé par chunks/step) :
#
#   config                                 s/step   chunks   s/chunk   pic VRAM
#   ------------------------------------   ------   ------   -------   --------
#   near (boucle Sinkhorn + GC)             88.47      44      2.011      9.1 G
#   + model.sinkhorn_closed_form            69.13      44      1.571      9.0 G
#   + grad_checkpoint: false                42.85      44      0.974     20.6 G
#   + chat_batch 4 lanes x 3 tours          15.14      36      0.421     14.7 G
#   + les deux                              11.14      36      0.309     16.4 G
#
# CHOIX DE LA FENÊTRE (`slots: 24`, décision user 2026-07-25). Une fois le pavage
# en place, la fenêtre n'a plus à couvrir « n'importe quel offset » mais seulement
# à LOGER les sessions entières. Mesuré sur 800 sessions de ce mix — tailles
# médiane 10, p90 17, p99 24, max 32 ; âges write->réponse médiane 2, p90 9,
# p99 16, max 27 (240 remplissages de lane par ligne) :
#
#   slots   sessions > slots   coupées   pad     couverture   s/step   800 steps
#   -----   ----------------   -------   -----   ----------   ------   ---------
#      16              10.0 %        55   40.9 %      97.0 %      27s       5.9 h
#      24               0.6 %         0   41.7 %      99.9 %      40s       8.9 h   <-
#      32               0.0 %         0   41.3 %     100.0 %      53s      11.8 h
#      48               0.0 %         0   42.5 %     100.0 %      80s      17.7 h
#
# 24 suffit : le fallback à cheval n'a JAMAIS servi, et on paie 0,1 point de
# couverture pour 3 heures. À retenir — LE PAVAGE RAPPORTE PLUS QUE D'ÉLARGIR :
# `_fast` non pavé couvrait 87,8 % en 11,8 h à 32 slots, pavé à 16 slots on est à
# 97,0 % en 5,9 h.
#
# LE MUR NE DÉPEND QUE DE `slots`, PAS DU BATCH. Un slot-step émet le même nombre
# d'ops quelle que soit la largeur du tenseur, donc s/step ≈ 1,66 x slots x
# grad_accum — vérifié sur deux régimes très différents : 4x3xga3 = 15,14 s pour
# 9 slot-steps (1,68 s chacun), 4x32xga1 = 53,0 s pour 32 (1,66 s chacun). Les
# LANES SONT GRATUITES en temps : baisser `batch` ne raccourcit pas le run, ça
# réduit seulement les données par update. Corollaire pratique : `chunks/step =
# batch x slots x grad_accum` = 96 ici, contre 128 pour `_fast` et ~44 pour `near`.
#
# Pourquoi ça marche : le step était à ~250x du régime compute-bound (386M sur
# ~150 tokens = ~0.5 TFLOP = ~10 ms de 3090, payés 2.7 s). Il est limité par le
# NOMBRE D'OPS ÉMISES, et le compte d'ops aten ne dépend pas du batch (11 462 à
# B=1 contre 11 486 à B=4). Voir chat_batch.py et mhc._sinkhorn_2x2.
#
# grad_checkpoint RESTE ON. Il coûte un forward de recompute (-26% d'ops) mais
# le graphe fait ici 96 seg-équivalents ; le couper n'a été mesuré sûr qu'à
# batch=1 (20,6 G, et le pic y suivait la longueur de la conv). Ne pas le rouvrir
# sans remesurer À CETTE largeur.
#
# CE QUE COÛTE L'ÉVAL, ET CE QU'ON EN A ENLEVÉ (mesuré 2026-07-25 sur la 3090,
# ckpt step_50 du run `_fast`, un palier complet chronométré par bloc). Sur les
# runs `near` et `_fast`, un palier coûtait 1100 à 2100 s — 26 % du mur de
# `near`, et il aurait fait 35 % de celui-ci. Décomposition, avant :
#
#   bloc                              temps   forwards   ms/forward
#   -------------------------------   -----   --------   ----------
#   evaluate x2 sources                49 s        172        ~290
#   evaluate_by_depth x2 sources       69 s        224        ~305
#   evaluate_math (le chat)           958 s       4401         218
#   -------------------------------   -----   --------   ----------
#   palier                           1076 s       4797
#
# 89 % de l'éval était dans `evaluate_math`, et 4242 de ses 4401 forwards
# étaient des pas de décodage greedy — des forwards d'UN SEUL TOKEN payés
# 218 ms. C'est le même mur que le train : launch-bound, sauf qu'ici il n'y a
# même pas de batch pour l'amortir (54 décodages STRICTEMENT séquentiels).
#
# Deux corrections, aucune n'est une approximation :
#
#   1. LE BRAS ABLATÉ EST DÉCODÉ UNE FOIS. Il part d'un préfixe constant avec
#      `init_mem=None`, en greedy, à poids gelés : les 27 tours gradés d'un
#      palier redécodaient 27 fois la MÊME phrase. Vérifié (8 redécodages, 1
#      seule sortie distincte, ici un appel d'outil `get_user_details`).
#      Palier chat : 958 -> 611 s (-36 %).
#   2. `chat.decode_every: 4`. Le décodage sert au grade exact-match, aveugle
#      tant que le canal n'est pas ouvert (grade 0.00 partout à step 50) ; la
#      sonde Δnll, elle, est sensible tout de suite et coûte UN forward par
#      tour gradé. On paie donc le grade un palier sur 4 (200/400/600/800) et
#      la sonde à tous. Palier chat sans décodage : 46 s (159 forwards).
#
#   palier                avant    après
#   ------------------   ------   ------
#   avec décodage        1076 s    729 s
#   sans décodage           —      164 s
#   16 paliers            4,8 h    1,4 h      (4 avec décodage, 12 sans)
#
# Le levier non dépensé : dans `evaluate`, le bras `res` est lui aussi une
# constante (`_fill(x, blank_id, dl)` ne dépend pas du contenu de x, et
# `init_mem=None`), soit ~20 % des 118 s de bloc code — ~6 min sur le run. Pas
# fait : petit, et le mur est ailleurs. Le vrai plafond restant est les 218 ms
# de latence de lancement par forward, que seul un graphe CUDA / `compile` sur
# le chemin de décodage ferait tomber (compile reporté, décision user 07-25).
#
# ATTENTION à la lecture des logs : `chat` normalise la CE globalement sur le
# batch, donc sa valeur n'est PAS comparable à celle d'un run B=1. La colonne
# comparable est `ce/lane` (CE normalisée dans chaque lane, moyennée sur les
# lanes supervisées) — hors gradient, elle ne sert qu'à ça.
#
# LANCEMENT :
#   TB_ROOT=/mnt/tb python -m deepseek_v4_mini.code_defer_native \
#     deepseek_v4_mini/configs/sft_sota_350m_tools_exec_tiled.yaml

tokenizer: HuggingFaceTB/SmolLM2-135M
model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_head: 64
  dropout: 0.0
  max_seq_len: 640
  n_hc: 2
  sinkhorn_iters: 20
  csa_m: 4
  hca_m: 16
  top_k_csa: 8
  n_win: 16
  d_latent_q: 64
  n_groups: 2
  n_experts: 4
  n_shared: 1
  top_k_experts: 2
  d_ff: 1536
  mem_dim: 512
  max_mem: 8
  mem_seed_slots: 4
  mem_read_rank: 8
  mem_read_swiglu: true
  use_dual_stream: true
  balance_loss_weight: 0.0001
  sinkhorn_closed_form: true
data:
  cache_dir: ${TB_ROOT}/data_cache
  sources:
  - name: codeparrot
    dataset: codeparrot/codeparrot-clean
    weight: 0.2
    stream_cap: 90000
  - name: stack_c
    dataset: bigcode/the-stack-smol
    data_dir: data/c
    weight: 0.06
    min_chunks: 2
    stream_cap: 10000
  - name: stack_rust
    dataset: bigcode/the-stack-smol
    data_dir: data/rust
    weight: 0.06
    min_chunks: 2
    stream_cap: 10000
  - name: stack_js
    dataset: bigcode/the-stack-smol
    data_dir: data/javascript
    weight: 0.06
    min_chunks: 2
    stream_cap: 10000
  - name: stack_sql
    dataset: bigcode/the-stack-smol
    data_dir: data/sql
    weight: 0.04
    min_chunks: 2
    stream_cap: 10000
  - name: stack_html
    dataset: bigcode/the-stack-smol
    data_dir: data/html
    weight: 0.04
    min_chunks: 2
    stream_cap: 10000
  - name: stack_css
    dataset: bigcode/the-stack-smol
    data_dir: data/css
    weight: 0.04
    min_chunks: 2
    stream_cap: 10000
  - name: fineweb
    dataset: HuggingFaceFW/fineweb
    config_name: sample-10BT
    content_key: text
    min_chunks: 2
    weight: 0.1
    stream_cap: 250000
  - name: fineweb_edu
    dataset: HuggingFaceFW/fineweb-edu
    config_name: sample-10BT
    content_key: text
    min_chunks: 2
    weight: 0.08
    stream_cap: 250000
  - name: wikipedia
    dataset: wikimedia/wikipedia
    config_name: 20231101.en
    content_key: text
    min_chunks: 2
    weight: 0.08
    stream_cap: 60000
  - name: finemath
    dataset: HuggingFaceTB/finemath
    config_name: finemath-4plus
    content_key: text
    min_chunks: 2
    weight: 0.08
    stream_cap: 250000
  - name: khanacademy
    dataset: HuggingFaceTB/cosmopedia
    config_name: khanacademy
    content_key: text
    min_chunks: 2
    weight: 0.04
    stream_cap: 60000
  - name: openstax
    dataset: HuggingFaceTB/cosmopedia
    config_name: openstax
    content_key: text
    min_chunks: 2
    weight: 0.06
    stream_cap: 60000
  - name: arxiv
    dataset: armanc/scientific_papers
    config_name: arxiv
    content_key: article
    min_chunks: 2
    weight: 0.06
    stream_cap: 60000
  seq_len: 512
  chunks_per_conv: 8
  defer_len: 16
  batch_size: 1
  var_chunk:
  - 128
  - 512
  n_files: 6000
  stream_cap: 90000
training:
  seed: 0
  steps: 800
  grad_accum: 1
  amp: true
  # Base = phase 1 SIF repass (canal WRITE natif, zéro registre, zéro persona).
  # Poids seuls, optim frais, step→0, banque fraîche. Voir l'en-tête.
  init_from: ${TB_ROOT}/checkpoints/v350_sif_repass/final_step2500.pt
  lr: 0.0001
  muon_lr: 0.00024
  muon_ref_mem_dim: 64
  warmup_steps: 0
  no_reset_files: 0
  cascade_depth: 4
  weight_decay: 0.01
  grad_clip: 1.0
  defer_weight: 1.0
  wsd_decay: true
  wsd_decay_start: 600                     # décision user 2026-07-25 : LR plein
                                           # jusqu'à 600 (300 de croisière APRÈS
                                           # la fin de l'anneal, contre 0 avant),
                                           # decay linéaire 600→800.
  wsd_decay_shape: linear
  decode_cache: true                       # cache KV aux décodages d'éval
                                           # (x1,6 mesuré ; l'éval pesait 21-25%
                                           # du mur). Hors gradient : ne touche
                                           # que le chemin de génération.
  grad_checkpoint: true
  gc_save_topk: false
  log_every: 1
  eval_every: 50
  eval_convs: 8
  eval_sources:
  - codeparrot
  - fineweb
  eval_depths:
  - 2
  - 8
  eval_depth_convs: 8
  eval_depth_sources:
  - codeparrot
  - fineweb
  save_every: 50
  save_dir: ${TB_ROOT}/checkpoints/v350_sft_sota_fromsif_exec_tiled
  metrics_file: ${TB_ROOT}/runs/v350_sft_sota_fromsif_exec_tiled/metrics.jsonl
chat:
  p_chat: 1.0
  weight: 1.0
  eval_convs: 12
  max_new: 240
  decode_every: 4                        # grade greedy tous les 4 paliers
                                         # (200/400/600/800) ; la sonde Δnll,
                                         # elle, reste à chaque palier. Voir
                                         # l'en-tête « CE QUE COÛTE L'ÉVAL ».
  stream: chat_batch
  gen:
    batch: 4
    slots: 24
    tile: true                             # pavage exact : aucune session coupée
    pool: 16                               # croît de lui-même jusqu'à 16x
    max_seg_tok: 512                       # coupe les tours plus longs
    stream: chat_mix
    gen:
      streams:
      - stream: sota_session
        weight: 0.5
        gen:
          real_cache_dir: ${TB_ROOT}/data_cache
          conv_cap: 8000
          max_turn_tok: 192
          max_conv_msgs: 10
          convs_per_session:
          - 2
          - 6
          p_requote: 0.5
          n_requote:
          - 1
          - 2
          requote_weight: 4.0
          surprisal_mode: sif
          sif_a: 0.0001
      - stream: tool_session
        weight: 0.25
        gen:
          datasets:
          - nvidia/Nemotron-Agentic-v1#tool_calling
          episode_cap: 6000
          max_turn_tok: 192
          max_schema_tok: 256
          eps_per_session:
          - 2
          - 5
          p_near: 0.5
          real_cache_dir: ${TB_ROOT}/data_cache
          surprisal_mode: sif
          sif_a: 0.0001
      - stream: code_exec
        weight: 0.25
        gen:
          dataset: nvidia/OpenCodeInstruct
          problem_cap: 6000
          max_problem_tok: 256
          max_code_tok: 224
          max_tests: 8
          probs_per_session:
          - 2
          - 4
          p_near: 0.5
          real_cache_dir: ${TB_ROOT}/data_cache
          surprisal_mode: sif
          sif_a: 0.0001
teacher:
  enabled: true
  distill_weight: 2.0
  target: surprisal
  anneal:
  - 150
  - 300

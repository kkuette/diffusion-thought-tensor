# dsv6 GRPO DÉSAGRÉGÉ 350M — cliquet RL depuis le ckpt SFT data-SOTA
# (pivot user 2026-07-24 : SFT sota depuis step_650 rearm, PUIS cliquet RL).
#
# NE PAS LANCER avant : (1) le smoke VRAM 350M rollout sur 3070Ti est vert
# (vram_smoke_350m.job), (2) le protocole est validé au 97M
# (rl_disagg_97m_smoke.yaml), (3) le SFT sota a produit son ckpt final
# (init_from ci-dessous — ajuster le step).
#
# Désagrégation : 6 rollout-workers 3070Ti (inférence 386M bf16 ~0.8 GB
# poids), learner 3090 (update think_row = une ligne de lm_head, léger).
# Pipeline du cliquet : pendant la passe distill/SFT de l'itération N sur la
# 3090, les workers génèrent déjà les rollouts de N+1 sur le ckpt N (le
# learner absorbe le retard via max_lag).
#
# learner : python -m deepseek_v4_mini.rl_disagg learner deepseek_v4_mini/configs/rl_disagg_350m.yaml
# workers : jobs ferme (voir scripts/farm/README + queue/)
tokenizer: HuggingFaceTB/SmolLM2-135M

model:                                     # = v350 386M (sft_sota_350m verbatim)
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_head: 64
  dropout: 0.0
  max_seq_len: 640
  n_hc: 2
  sinkhorn_iters: 20
  csa_m: 4
  hca_m: 16
  top_k_csa: 8
  n_win: 16
  d_latent_q: 64
  n_groups: 2
  n_experts: 4
  n_shared: 1
  top_k_experts: 2
  d_ff: 1536
  mem_dim: 512
  max_mem: 8
  mem_seed_slots: 4
  mem_read_rank: 8
  mem_read_swiglu: true
  use_dual_stream: true
  balance_loss_weight: 1.0e-4
  # decode_* : prérequis du GraphDecodeRunner (rl.decode_graphs ci-dessous).
  # Bit-identiques au chemin historique partout ailleurs (prouvés torch.equal
  # f64+f32, FINDINGS 2026-07-27) ; inertes à l'entraînement (gates no-grad).
  decode_fuse: true
  decode_dense_moe: true
  decode_static_cache: true

data:
  seq_len: 512
  chunks_per_conv: 8
  defer_len: 16
  var_chunk: [128, 512]
  cache_dir: ${TB_ROOT}/data_cache
  envs:
  - name: code
    kind: code
    dataset: codeparrot/codeparrot-clean
    weight: 0.20
    n_files: 3000
    stream_cap: 90000
    lambda_write: 0.03
  - name: sota                             # sessions réelles longues (dense) :
    kind: sota                             # la pression mémoire du SFT continue
    weight: 0.25                           # d'exister dans le mix RL
    lambda_write: 0.03
    gen:
      real_cache_dir: ${TB_ROOT}/data_cache
      conv_cap: 8000
      max_turn_tok: 192
      max_conv_msgs: 10
      convs_per_session: [2, 6]
      p_requote: 0.5
      n_requote: [1, 2]
      surprisal_mode: sif
      sif_a: 1.0e-04
  - name: tools                            # cible cliquet 1 : grader
    kind: tool                             # vérifiable + économie think
    weight: 0.30
    lambda_write: 0.0
    gen:
      datasets:                          # CC-BY-4.0 — libre pour l'open-core
      - 'nvidia/Nemotron-Agentic-v1#tool_calling'
      # Nemotron SEUL pour le premier cliquet (2026-07-27) : c'est la
      # distribution où le SFT valsif_stair a ouvert la sélection (33 % de
      # noms exacts en éval, contre 19 % sur le pool mixte avec glaive — que
      # le SFT n'a jamais vu). La ressource rare du GRPO tools est l'épisode
      # « touchable » (~10-15 % des tirages ; dedans, le contraste est bon :
      # 4-5/8 rollouts positifs) — on maximise leur taux d'abord, glaive
      # revient quand la politique généralise.
      # (glaiveai/glaive-function-calling-v2 = Apache, réserve ; xlam-60k =
      #  gated ; Salesforce/APIGen-MT-5k = CC-BY-NC + clause anti-OpenAI :
      #  JAMAIS dans le train, éval éventuelle seulement)
      episode_cap: 6000
      max_turn_tok: 192
      max_schema_tok: 256
      eps_per_session: [2, 5]
      real_cache_dir: ${TB_ROOT}/data_cache
      surprisal_mode: sif
      sif_a: 1.0e-04
  - name: exec                             # cible cliquet 2 : exécution de
    kind: exec                             # code — le juge = l'interpréteur
    weight: 0.25                           # (exec_sandbox, tests passés x
    lambda_write: 0.0                      # économie think)
    max_new: 240                           # tour code complet (code 224 tok +
                                           # fence) : ~4x le coût décodage du
                                           # tour d'appel tools — compté dans
                                           # le débit s/group des workers
    gen:
      dataset: nvidia/OpenCodeInstruct     # CC-BY-4.0 ; golds vérifiés en
      problem_cap: 6000                    # sandbox au seed (grade(gold)=1)
      max_problem_tok: 256                 # (open-r1/PrimeIntellect : pas de
      max_code_tok: 224                    # licence déclarée => exclus, même
      max_tests: 8                         # règle qu'APIGen-MT)
      probs_per_session: [2, 4]
      real_cache_dir: ${TB_ROOT}/data_cache
      surprisal_mode: sif
      sif_a: 1.0e-04

rl:
  seed: 0
  train_scope: think_row                   # ancre du cliquet ; élargir SEULEMENT
                                           # sur verdict (post-mortem v1 : le
                                           # full-model RL érode le backbone)
  # Ckpt SFT valsif_stair (2026-07-27) : la gate est OUVERTE dessus — tools
  # nom exact 10/30 (ablaté 0/30), grade_calls moyen 0.133 avec des tours à
  # 1.00/0.67/0.33 ; exec 0.222 vs null 0.006. Voir FINDINGS 2026-07-27.
  init_from: ${TB_ROOT}/checkpoints/v350_sft_valsif_stair/final.pt
  n_lives_per_worker: 2
  max_episodes_per_life: 0
  cascade_depth: 4                         # banque complète V3 (comme le SFT)
  # = la map EFFECTIVE du trainer SFT (son défaut, vérifié au --check du run
  # valsif_stair). L'ancienne valeur [0,0,0,1,1,1,2,2,2,3,3,3] faisait lire la
  # cascade avec un routage par couche que le ckpt n'a JAMAIS vu à
  # l'entraînement — les rewards mesurées n'auraient pas été celles du modèle.
  cascade_map: [0, 0, 0, 0, 0, 0, 0, 0, 1, 2, 3, 4]
  steps: 1000
  group_size: 8
  groups_per_step: 4
  lr: 3.0e-04
  temp: 3.0
  lambda_write: 0.03
  clip_low: 0.2
  clip_high: 0.28
  kl_coef: 1.0e-2
  min_reward_std: 1.0e-4
  max_resample: 4
  # Amorçage à froid de la politique write. Le ckpt SFT n'a jamais émis
  # <think> (p_w ≈ 0.02 ⇒ banque vide en rollout, tools 0/27 groupes vivants
  # au pré-vol du 07-27) alors que son comportement d'entraînement était
  # « écrire chaque seg ». p_b = max(p_w, floor) ; 0.5 et pas 1.0 : la variance
  # intra-groupe vient de la DIVERSITÉ des motifs d'écriture. logp_old
  # enregistre le comportement réel ; on redevient on-policy dès que think_row
  # dépasse le plancher. Voir rollout().
  explore_floor: 0.5
  grad_clip: 1.0
  save_every: 50
  think_nmax: 8
  think_floor: 0.4
  max_new: 64
  amp: true
  decode_cache: true                       # rollout = un ÉCHANTILLON : une
                                           # bascule MoE due aux ULP y est aussi
                                           # légitime qu'un autre tirage (déc.
                                           # 07-25) ; ×1.6 sur le goulot worker
  decode_graphs: true                      # tour de réponse par CUDA graphs +
                                           # rebind (même classe ULP, fp32 dans
                                           # les graphs) : 400 tok/s agrégés
                                           # par appel vs 82 eager — 4,9× sur
                                           # le goulot worker (jobs 34-36,
                                           # FINDINGS 07-28) ; dégrade en
                                           # generate au moindre pépin
  disagg:
    root: ${TB_ROOT}/rl/disagg_350m
    publish_every: 1
    max_lag: 2
    keep_weights: 3
    poll_s: 2.0
    max_pending: 8                         # = gps x max_lag (anti-stale)
    lives_save_every: 20
    xdom_every: 50
    max_groups: 0

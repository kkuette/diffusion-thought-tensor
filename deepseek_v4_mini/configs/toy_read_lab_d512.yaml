# toy_read_lab — matrice d512 : RE-BASELINE de la largeur de banque.
#
# Clone de toy_read_lab.yaml avec model.d_model 256 → 512 (r3 force
# mem_dim = d_model : la LIGNE de banque double de largeur) et un save_dir
# séparé pour ne pas écraser la matrice d256.
#
# POURQUOI : le round-trip oracle (relire la valeur depuis la ligne SEULE,
# sans modèle) plafonne à 59.9 % sur les codes segsif à d=256 — le code n'est
# pas inversible, la limite est le SNR de la ligne, pas le read. À d=512 le
# même round-trip remonte à 94.9 %. 512 est aussi le mem_dim RÉEL du 350M :
# cette matrice est donc celle qui parle du modèle cible, la d256 devient une
# étude de capacité.
#
# n_heads reste 8 (512/8 = 64 par tête) et code.n_pos reste 8 (blocs chunk de
# 64 dims au lieu de 32). Coût : ~2.5× les params, runs ~2-3× plus lents.
#
# UNE config, quatre variantes (--variant r0|r1|r2|r3), un sous-dossier par
# variante sous training.save_dir. Le backbone est VANILLA (aucun élément
# dsv4) et la banque est posée par l'environnement : la seule chose qui change
# entre les runs est la CLASSE DE FONCTIONS DU READ.
#
#   r0  fast-weight (contrôle, port de model.py:282-394)
#   r1  cross-attention contenu
#   r2  r0 + tête de copie (pointer readout)
#   r3  banque en espace d'embeddings (mem_dim forcé à d_model) + pointer nu
#
# Axe FORMAT DE CODE (r3 seulement) :
#   --code mean|chunk|phase|rows        (phase 2, pool du SPAN VALEUR)
#   --code segmean|segphase|segsif      (phase 3, pool du SEGMENT ENTIER)
#   --code pack|segpack                 (phase 5, ligne PARTITIONNÉE en blocs)
#
# Axe RÉGIME DE WRITE :
#   --write fact   (défaut) l'oracle n'écrit qu'après les segs PORTEURS
#   --write every  il écrit après CHAQUE seg (régime du 350M : le flux évince
#                  les faits du FIFO). Exige un code de SEGMENT.
# Axe POSITION : code.pos_offset (ou --pos-offset K) décale l'index de phase.
# Axe PARTITION : code.pack_blocks (ou --pack-blocks B) découpe la ligne pack.
# Tous ajoutent un suffixe au save_dir (_o<K>, _wev, _b<B> hors défaut) :
# aucun run passé n'est écrasé.
#
# ⚠️ Cette config NE PASSE PAS par cfg_schema (réservé au trainer principal) :
# toy_read_lab.py fait son propre paths.load_yaml.
#
# LANCEMENT (une 3070Ti 8 Go suffit) :
#   TB_ROOT=/mnt/tb python -m deepseek_v4_mini.toy_read_lab \
#     deepseek_v4_mini/configs/toy_read_lab.yaml --variant r0
#
# SMOKE CPU (dims minuscules, filler template, 2 pas) :
#   python -m deepseek_v4_mini.toy_read_lab \
#     deepseek_v4_mini/configs/toy_read_lab.yaml --variant r0 --smoke --device cpu

tokenizer: HuggingFaceTB/SmolLM2-135M

model:
  d_model: 512            # RE-BASELINE (d256 : round-trip segsif 59.9 %)
  n_layers: 6
  n_heads: 8
  d_ff_mult: 4
  mem_dim: 512            # r3 l'écrase à d_model (banque = embeddings)
  max_mem: 8              # FIFO, comme le 350M
  max_seq_len: 320
  dropout: 0.0
  fw_rank: 8              # = mem_read_rank du 350M
  read_layers: []         # vide = toutes les couches lisent (comme le 350M)
  x_dim: 2048             # dim interne des cross-attn r1/r3 (0 = d_model).
                          # 2048 = APPARIEMENT DE BUDGET avec le hypernetwork
                          # fast-weight de r0 : r0 36.56M / r1 36.17M / r2
                          # 36.89M (±1 %). r3 reste à 24.11M — structurel : sa
                          # V n'est PAS projetée (c'est sa définition), on ne
                          # peut pas lui dépenser les params sans casser la
                          # variante. Mettre 0 pour la version « naturelle »
                          # (cross-attn en d_model, r1 à 19.65M).
  ptr_bias_init: -8.0     # porte du pointer readout FERMÉE à l'init
  oracle_ka_scale: 0.2    # K[slot]/A[attr] = petits offsets de liaison
  oracle_seed: 20260730

# ── PHASE 2 : axe FORMAT DE CODE (--code mean|chunk|phase|rows, r3 seulement)
# Le pool MOYEN de la phase 1 détruit l'ordre des tokens (la ligne est un sac
# de tokens) ⇒ grade 0.000 partout malgré Δnll +3.80 sur r3. Ces knobs pilotent
# les formats qui PRÉSERVENT l'ordre. --code mean les ignore intégralement
# (chemin bit-à-bit de la phase 1, sous save_dir/<variant>/).
code:
  n_pos: 8                # tokens de valeur retenus par fait.
                          # Distribution ÉCHANTILLONNÉE des longueurs de " "+val
                          # (10 slots équiprobables) : 1 tok 4.6 %, 2 tok 27.0 %,
                          # 3 tok 27.4 %, 4 tok 9.3 %, 5 tok 1.7 %, 6 tok 8.3 %,
                          # 7 tok 17.0 %, 8 tok 4.8 % ⇒ n_pos=7 couvre 95.2 %,
                          # n_pos=8 couvre 100 %. 8 est aussi une puissance de 2
                          # qui divise d_model=512 (blocs chunk de 64 dims) ET
                          # le d_model=64 du smoke (blocs de 8).
  rope_base: 0.0          # binding `phase`. 0 (ou négatif) = DFT :
                          # θ_i = 2π·(i mod n_pos)/n_pos, la SEULE famille de
                          # fréquences qui annule EXACTEMENT l'interférence
                          # entre positions (⟨cos(θ_i·Δ)⟩_i = 0 ∀Δ≠0).
                          # (partagé par `phase` ET `segphase`.)
                          # ÉCART ASSUMÉ vs la spec « RoPE base 100 » : mesuré,
                          # la forme RoPE littérale θ_i = base^(−2i/d) a θ_max =
                          # 1 rad, donc ⟨cos(θ_i·1)⟩ = 0.95 à base 100 et 0.54 à
                          # base 1 — elle ne sépare PAS 8 positions (round-trip
                          # oracle 3/8 à base 100, 6/8 au mieux, contre 8/8 en
                          # DFT). Mettre une base > 0 rejoue la forme RoPE
                          # (gardée comme ablation).

  # ── PHASE 3 : --code segmean|segphase (r3 seulement) ──────────────────────
  # Ces deux formats RETIRENT le privilège d'oracle sur le span valeur : le
  # code poole le SEGMENT PORTEUR ENTIER (template ChatML compris), comme le
  # write du 350M qui ne sait pas où est la valeur. On GARDE l'autre privilège
  # (le write n'est déclenché que sur les segs porteurs) — une variable à la
  # fois. segmean = contrôle (coût du bruit de template seul, ordre détruit) ;
  # segphase = le test (binding DFT sur la position DANS LE SEGMENT) ;
  # segsif = segphase PONDÉRÉ SIF = la recette cible du write du 350M.
  seg_n_pos: 32           # positions bindées dans le segment porteur.
                          # MESURÉ (393 segs porteurs du stream persona) :
                          # longueur ∈ [12, 26], moyenne 18.5, p98 = 23 ⇒ 32 est
                          # la puissance de 2 qui couvre 100 %. Fin du span
                          # valeur ∈ [6, 22] ⇒ 32 la couvre aussi à 100 %.
                          # Débordement (jamais observé ici) : poolé SANS
                          # rotation — contenu gardé, position perdue.
                          # COÛT : le pointer voit max_mem×seg_n_pos = 8×32 =
                          # 256 candidats (contre 8 en `mean`, 64 en `phase`),
                          # soit un produit [B,T,256] au lieu de [B,T,8] sur
                          # l'attention plate — négligeable devant le [B,T,V]
                          # du biais de logits (V = 49 154).
  pos_offset: 0           # DÉCALAGE de l'index de phase (`phase`, `segphase`,
                          # `segsif` seulement). 0 = DÉFAUT et rétro-compat
                          # bit-à-bit des runs passés.
                          # POURQUOI le knob : à offset 0 la position 0 a
                          # rot(0) = IDENTITÉ, donc son token se superpose SANS
                          # étiquette rotationnelle à K[slot]+A[attr], qui
                          # vivent eux aussi NON tournés dans la ligne (dumps :
                          # SV-19621 → EX-19621, les chiffres exacts mais le
                          # premier token de la valeur faux). offset=k tourne le
                          # token de position j de θ·(j+k), AU WRITE ET aux
                          # candidats du readout : plus aucune position ne
                          # partage la phase identité.
                          # WRAP : le binding DFT est de période n_pos, donc
                          # l'offset CONSOMME k positions — il faut
                          # n_pos ≥ longueur_max + k. MESURÉ sur le stream :
                          # segs porteurs ≤ 26 tokens ⇒ seg_n_pos 32 avec
                          # offset 1 ne wrappe JAMAIS ; valeurs ≤ 8 tokens ⇒
                          # `phase` à n_pos 8 avec offset 1 fait wrapper la
                          # position 7 des 18 valeurs de 8 tokens (mesuré : le
                          # round-trip reste 100 % / +3.2σ, K/A à 0.2 est trop
                          # faible pour mordre à d=512 ; mettre n_pos 16 pour
                          # supprimer le wrap si un jour il compte).
                          # ⚠️ MESURÉ à d=512 : l'offset ne change RIEN au
                          # round-trip oracle (segsif 97.4 → 97.5 %, aucune
                          # anomalie position-0 dans le code lui-même) — il ne
                          # se teste donc qu'au niveau du READ APPRIS.

  # ── PHASE 5 : --code pack|segpack (r3 seulement) ──────────────────────────
  # La ligne n'est plus une SUPERPOSITION mais une PARTITION : pack_blocks
  # sous-espaces disjoints, bloc 0 = CLÉ dédiée de la paire (slot, attr), blocs
  # 1.. = UN token chacun (R_j^T·ê(t_j), frames orthonormés figés). Zéro
  # interférence entre positions, mais capacité DURE de pack_blocks−1 tokens.
  # `pack` garde le privilège de span (blocs = tokens de la valeur) ;
  # `segpack` le retire (blocs = les top-(pack_blocks−1) tokens SIF du segment,
  # dans l'ordre du segment) — c'est le bras comparable à segsif.
  pack_blocks: 8          # nombre TOTAL de blocs, CLÉ COMPRISE (d_model doit
                          # être divisible par lui ; ⇒ d_sub = 512/8 = 64 dims
                          # par bloc, 7 tokens de contenu).
                          # SWEEP ORACLE k×d_sub (500 faits held-out, partition
                          # (k_val+1)·d_sub = 512, RT = top-1 par bloc sur les
                          # tokens de valeur | clé = retrieval rang-1 sur des
                          # banques de 8 lignes à clés distinctes) :
                          #   d_sub 64 (8 blocs)   RT 100.0 % +3.84σ | clé 100 %
                          #   d_sub 32 (16 blocs)  RT  95.9 % +1.42σ | clé 100 %
                          #   d_sub 16 (32 blocs)  RT  40.2 % −0.21σ | clé 100 %
                          #   d_sub  8 (64 blocs)  RT   3.3 % −1.37σ | clé 100 %
                          #   d_sub  4 (128 blocs) RT   0.0 % −2.41σ | clé 100 %
                          #   d_sub  1 (512 blocs) RT   0.0 % −3.53σ | clé 25 %
                          # « pourquoi pas 512 blocs de 1 dim » : un bloc de
                          # d_sub dims oppose le token cible au MAX de |V|
                          # concurrents, dont le cos est ≈ √(2·ln|V|/d_sub) ;
                          # il atteint 1 vers d_sub ≈ 2·ln|V| ≈ 21.6 (V=49 154).
                          # Le cliff mesuré est bien là : 64 → 32 → 16 = 100 →
                          # 95.9 → 40.2 %. La CLÉ, elle, ne discrimine que 8
                          # lignes (pas 49 k) et tient donc jusqu'à d_sub 4 :
                          # c'est le CONTENU qui fixe le plancher, pas l'adresse.
                          # 8 = le verdict (RT ≥ 99 % ET clé ≥ 99 %, marge
                          # saine). ⚠️ ARBITRAGE OUVERT : à pack_blocks 16 la
                          # sélection SIF du `segpack` couvre 99.9 % des tokens
                          # de valeur au lieu de 63.5 %, et le RT EFFECTIF
                          # (couverture × RT) monte à 98.0 % contre 63.5 % —
                          # payé par une marge à +1.4σ seulement. Si le grade de
                          # r3_segpack plafonne par MANQUE DE CAPACITÉ (valeurs
                          # tronquées), 16 est le knob à tourner.
  sif_a: 0.01             # `segsif`/`segpack` : le a de w = a/(a+p(token)).
                          # La table unigram vient de _sif_table() de
                          # PersonaChatStream (300 convs, rng 4242) — MÊME
                          # recette que le write du 350M. Le stream d'entraîne-
                          # ment du toy reste surp OFF : le SIF n'entre QUE
                          # dans le code de banque, jamais dans la loss.
                          # ÉCART ASSUMÉ vs le 350M (a=1e-4) : MESURÉ, a=1e-4
                          # DÉGRADE la strate `code` (round-trip 28.8 % en
                          # poids uniformes → 15.1 %) parce que les codes/refs/
                          # plaques sont faits de digrammes FRÉQUENTS (w̄ 0.042
                          # sur les tokens chiffrés contre 0.62 sur les valeurs
                          # linguistiques) — le SIF les écrase pile là où on en
                          # a besoin. Balayage à d=256 sur la strate `code` :
                          # 1e-4 15.1 % | 3e-3 45.3 % | 1e-2 59.9 % | 3e-2
                          # 55.9 % | 1e-1 45.6 % | 1 30.9 % | uniforme 28.8 %.
                          # 1e-2 est l'optimum ; mettre 1e-4 pour rejouer
                          # exactement la recette du 350M (ablation).

training:
  seed: 0
  steps: 3000
  batch_convs: 8          # 1 pas = un groupe de 8 conversations complètes
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  amp: true               # bf16 autocast (ignoré sur cpu)
  log_every: 20
  eval_every: 200
  eval_convs: 24          # convs gradées par bras (held-out ET train)
  max_new: 48
  save_dir: ${TB_ROOT}/checkpoints/toy_read_lab_d512

# kwargs de la branche persona de chat.eval_gen de sft_recall_350m_table2.yaml.
# pool_split est SURCHARGÉ par le code : 'train' pour l'entraînement et le
# contrôle mécanisme, 'eval' pour le held-out.
persona:
  gen:
    p_smalltalk: 0.15
    n_facts:
    - 1
    - 3
    n_queries:
    - 1
    - 2
    p_ack: 0.5
    p_update: 0.15
    p_beyond: 0.15
    value_weight: 4.0
    real_filler: HuggingFaceTB/smol-smoltalk
    real_cap: 20000
    real_max_tok: 96
    p_real: 0.8
    real_cache_dir: ${TB_ROOT}/data_cache

# sft_persona_350m_sif_repass_rearm — RÉ-ARMEMENT du teacher en warm restart.
#
# Verdict du run teacher-off (2026-07-23, stoppé @176) : Δnll −0.011 @150,
# grade 0 partout, plat sur les 3 tranches d'âge = signature 5i exacte.
# La base SIF-native rend le canal WRITE contenu-porteur (GAP code +4 natif)
# mais la politique de READ sélectif (adresser la banque depuis une question)
# ne s'amorce PAS sous CE chat seul — le teacher servait à forcer le read,
# pas à installer le format des codes. Conséquence design prochaine phase 1 :
# la fenêtre β au decay WSD n'est pas optionnelle.
#
# CE RUN (décision user 2026-07-23) : répétition générale du design
# mid-training « registre d'abord, fenêtre β ensuite » —
#   - init_from = step_150 du run teacher-off (registre payé, chat 2.0) ;
#     compteur → 0, numérotation GLOBALE = step natif + 150
#   - teacher ré-armé PLEIN sur [0,150] (β=1 : 150 steps pour graver le canal
#     read sous teacher, décision user v2), puis rampe β 1→0 sur [150,300]
#   - WSD decay dès la fin de l'anneal (300 → 650, linéaire → 0) : le levier
#     « WSD post-anneal » payé d'office pour consolider à β=0
#   - steps 650 (= global 800) ; juge @450-650 natif (= global 600-800)
#
# LANCEMENT :
#   python -m deepseek_v4_mini.code_defer_native \
#     deepseek_v4_mini/configs/sft_persona_350m_sif_repass_rearm.yaml
tokenizer: HuggingFaceTB/SmolLM2-135M

model:                                     # = v350_phase1_10b (386M)
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_head: 64
  dropout: 0.0
  max_seq_len: 640
  n_hc: 2
  sinkhorn_iters: 20
  csa_m: 4
  hca_m: 16
  top_k_csa: 8
  n_win: 16
  d_latent_q: 64
  n_groups: 2
  n_experts: 4
  n_shared: 1
  top_k_experts: 2
  d_ff: 1536
  mem_dim: 512
  max_mem: 8
  mem_seed_slots: 4
  mem_read_rank: 8
  mem_read_swiglu: true
  use_dual_stream: true
  balance_loss_weight: 1.0e-4

data:
  cache_dir: /mnt/tb/data_cache
  # --- identique au bloc sft_school (cache hit garanti sur le cache local)
  sources:
  - name: codeparrot
    dataset: codeparrot/codeparrot-clean
    weight: 0.20
    stream_cap: 90000
  - name: stack_c
    dataset: bigcode/the-stack-smol
    data_dir: data/c
    weight: 0.06
    min_chunks: 2
    stream_cap: 10000
  - name: stack_rust
    dataset: bigcode/the-stack-smol
    data_dir: data/rust
    weight: 0.06
    min_chunks: 2
    stream_cap: 10000
  - name: stack_js
    dataset: bigcode/the-stack-smol
    data_dir: data/javascript
    weight: 0.06
    min_chunks: 2
    stream_cap: 10000
  - name: stack_sql
    dataset: bigcode/the-stack-smol
    data_dir: data/sql
    weight: 0.04
    min_chunks: 2
    stream_cap: 10000
  - name: stack_html
    dataset: bigcode/the-stack-smol
    data_dir: data/html
    weight: 0.04
    min_chunks: 2
    stream_cap: 10000
  - name: stack_css
    dataset: bigcode/the-stack-smol
    data_dir: data/css
    weight: 0.04
    min_chunks: 2
    stream_cap: 10000
  - name: fineweb
    dataset: HuggingFaceFW/fineweb
    config_name: sample-10BT
    content_key: text
    min_chunks: 2
    weight: 0.10
    stream_cap: 250000
  - name: fineweb_edu
    dataset: HuggingFaceFW/fineweb-edu
    config_name: sample-10BT
    content_key: text
    min_chunks: 2
    weight: 0.08
    stream_cap: 250000
  - name: wikipedia
    dataset: wikimedia/wikipedia
    config_name: 20231101.en
    content_key: text
    min_chunks: 2
    weight: 0.08
    stream_cap: 60000
  - name: finemath
    dataset: HuggingFaceTB/finemath
    config_name: finemath-4plus
    content_key: text
    min_chunks: 2
    weight: 0.08
    stream_cap: 250000
  - name: khanacademy
    dataset: HuggingFaceTB/cosmopedia
    config_name: khanacademy
    content_key: text
    min_chunks: 2
    weight: 0.04
    stream_cap: 60000
  - name: openstax
    dataset: HuggingFaceTB/cosmopedia
    config_name: openstax
    content_key: text
    min_chunks: 2
    weight: 0.06
    stream_cap: 60000
  - name: arxiv
    dataset: armanc/scientific_papers
    config_name: arxiv
    content_key: article
    min_chunks: 2
    weight: 0.06
    stream_cap: 60000
  seq_len: 512
  chunks_per_conv: 8
  defer_len: 16
  batch_size: 1
  var_chunk:
  - 128
  - 512
  n_files: 6000
  stream_cap: 90000

training:
  seed: 0
  steps: 650                               # = global 800 (150 déjà payés)
  grad_accum: 4
  amp: true
  # Base = step_150 du run teacher-off (registre chat payé : 5.7→2.0).
  # Poids seuls, schedule/optim frais, step→0. Banque fraîche.
  init_from: /mnt/tb/checkpoints/v350_sft_persona_sif_repass/step_150.pt
  lr: 1.0e-04
  muon_lr: 2.4e-04
  muon_ref_mem_dim: 64
  warmup_steps: 0                          # LR plein dès step 1 (recette sif_hot)
  no_reset_files: 0                        # une seule vie de banque pour tout le run
  cascade_depth: 4                         # banque complète V3 (recette sif_hot)
  weight_decay: 0.01
  grad_clip: 1.0
  defer_weight: 1.0
  wsd_decay: true                          # levier « WSD post-anneal » payé d'office
  wsd_decay_start: 300                     # decay dès β=0 (fin d'anneal)
  wsd_decay_shape: linear
  grad_checkpoint: true
  gc_save_topk: false
  log_every: 1
  eval_every: 50                           # suivi fin anneal + post-retrait
  eval_convs: 8
  eval_sources:
  - codeparrot
  - fineweb
  eval_depths: [2, 8]
  eval_depth_convs: 8
  eval_depth_sources:
  - codeparrot
  - fineweb
  save_every: 50
  save_dir: /mnt/tb/checkpoints/v350_sft_persona_sif_repass_rearm
  metrics_file: /mnt/tb/runs/v350_sft_persona_sif_repass_rearm/metrics.jsonl

chat:
  stream: persona
  p_chat: 1.0
  weight: 1.0
  eval_convs: 12
  max_new: 24
  gen:
    real_filler: HuggingFaceTB/smol-smoltalk
    real_cache_dir: /mnt/tb/data_cache
    surprisal_mode: sif                    # SIF a/(a+p) — MÊME famille de codes
    sif_a: 1.0e-04                         # que le pretrain repass : continuité
    value_weight: 4.0                      # pression native routage read→valeur

# TEACHER RÉ-ARMÉ (verdict teacher-off @150 : le read ne s'ouvre pas seul).
# Cible surprisal (label-free, = sif_hot) ; v2 (user) : 150 steps de teacher
# PLEIN (β=1) pour graver le canal, puis rampe 1→0 sur [150,300]. La rétention
# post-retrait est portée par value_weight ×4 + le WSD decay qui consolide.
teacher:
  enabled: true
  distill_weight: 2.0
  target: surprisal
  anneal: [150, 300]

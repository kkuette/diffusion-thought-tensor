# rl_recall_env_smoke — l'ENV DE RAPPEL GÉNÉRAL, en configuration de fumée.
#
# CE QUE CE FICHIER EST. Le curriculum de `deepseek_v4_mini/data/recall_env.py` (vies
# de rappel scriptées et APPARIÉES + reward vérifiable), posé dans la forme que
# `rl_disagg` consomme pour que `--check` le valide AVANT de réserver le GPU.
# Le reste du fichier (model/rl) est repris de rl_recall_350m.yaml pour que la
# config ait une FORME complète et vérifiable ; ce n'est PAS un run prêt à
# partir : le câblage rollout (agent 2) et l'algo (agent 3) n'existent pas
# encore, et `init_from` pointe le ckpt SFT rti qui n'est pas fini.
#
#   python -m deepseek_v4_mini.cfg_schema        # valide toutes les configs
#
# CE QUI SE RÈGLE ICI, ET POURQUOI
#   • `write_policy: facts` — la politique de RÉFÉRENCE qui décide de la
#     résidence en FIFO. C'est la borne OPTIMISTE (« aucune politique
#     d'écriture ne pouvait garder ce fait »), et c'est ce qu'il faut : sous la
#     borne pessimiste `all`, on neutraliserait des sondes qu'une politique qui
#     écrit à propos aurait réussies — c'est-à-dire exactement le signal que le
#     cliquet doit apprendre. Coïncide avec le bras rti déployé
#     (`rti.write_every_turn: false`).
#   • `inject_groups: 2` — le LAYOUT du préfixe injecté, qui voyage DANS le
#     script. Le rollout DOIT construire son `RtiConfig` avec cette valeur, en
#     train comme en éval : r5 v1 a entraîné sur 1 groupe, évalué sur top-2, et
#     le grade est tombé à 0.067 MALGRÉ un retriever parfait.
#   • `filler_per_fact: [1, 3]` — les distracteurs ne sont pas du décor : une
#     vie sans distracteur résident donne un retriever qui ne discrimine rien.
#     Le remplissage est du texte RÉEL (smol-smoltalk, même cache que le SFT) ;
#     sans `real_filler`, repli sur les gabarits persona (chemin hermétique).
#   • `p_beyond: 0.15` sur des vies à 2-4 faits ne produit AUCUNE sonde
#     impossible (4 faits tiennent dans 8 slots) — c'est correct. Les sondes
#     impossibles se fabriquent en SATURANT la banque : voir le bloc
#     `recall_env` commenté « saturé » plus bas.
#
# STATS MESURÉES avec ces réglages (self-test, 300 vies, repli gabarits) :
#   âge atteint moyen 10.8 segs, médiane 9, p10 5 / p90 18 ; ~21 segs par vie ;
#   0 % de sondes impossibles sous `facts`, ~60 % sous `all`.

tokenizer: HuggingFaceTB/SmolLM2-135M

model:                                     # = rl_recall_350m.yaml verbatim
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_head: 64
  dropout: 0.0
  max_seq_len: 640
  n_hc: 2
  sinkhorn_iters: 20
  csa_m: 4
  hca_m: 16
  top_k_csa: 8
  n_win: 16
  d_latent_q: 64
  n_groups: 2
  n_experts: 4
  n_shared: 1
  top_k_experts: 2
  d_ff: 1536
  mem_dim: 512
  max_mem: 8
  mem_seed_slots: 8                        # banque FIXE dès le tour 1
  mem_read_rank: 8
  mem_read_swiglu: true
  use_dual_stream: true
  balance_loss_weight: 1.0e-4
  decode_fuse: true
  decode_dense_moe: true
  decode_static_cache: true

data:
  seq_len: 512
  chunks_per_conv: 8
  defer_len: 16
  cache_dir: ${TB_ROOT}/data_cache
  envs:
  - name: recall_env                       # l'env de CE fichier (kind branché
    kind: recall_env                       # dans streams.py + rl_disagg).
    weight: 1.0
    lambda_write: 0.0
    max_new: 96                            # réponse courte OU un bloc python
    gen: {}                                # le curriculum vit dans recall_env:
# L'env `sota` (pression dense de fond) A ÉTÉ RETIRÉ, et ce n'est pas un oubli.
# Sous rti la banque fast-weight est intégralement CONTOURNÉE (layer_banks tout
# à None, write=False) : le rollout dense de rl_defer_grpo_lives lit cette
# banque et écrit ses gists dedans, c'est-à-dire qu'il optimiserait un canal
# INERTE pour ce checkpoint — un gradient sur du bruit. Le worker le refuse à
# l'assert (rl_disagg.Worker._rti_setup). La pression « ne pas éroder le chat
# général » passe par la KL à la ref (rl.kl_coef), pas par un env mélangé ;
# rouvrir le mix demandera d'abord un rollout dense qui passe, lui aussi, par
# le préfixe injecté.

# ── LE CURRICULUM ────────────────────────────────────────────────────────────
recall_env:
  life_seed: 0                             # seed → script. Deux workers avec le
                                           # même (life_seed, life) produisent le
                                           # MÊME script, bit à bit : c'est ce
                                           # qui rend l'avantage de groupe
                                           # contrefactuel et l'ancrage par
                                           # index de tour (GiGPO) bien défini.
  strata:                                  # « rappel général » = mix de strates
    persona: 0.35                          #   entité/nom rare
    numeric: 0.25                          #   valeur numérique
    code: 0.20                             #   constante+nom réutilisés dans un
                                           #   code EXÉCUTÉ (juge = interpréteur)
    preference: 0.20                       #   consigne en langue naturelle
  n_facts: [2, 4]
  n_probes: [1, 3]
  filler_per_fact: [1, 3]                  # densité de distracteurs
  p_ack: 0.5
  age_bins: [[2, 6], [7, 12]]              # distribution des âges de sonde
  age_weights: [0.6, 0.4]
  p_beyond: 0.15
  max_groups: 8                            # = model.max_mem
  write_policy: facts                      # borne optimiste (voir en-tête)
  inject_groups: 2                         # = rti.train_groups == eval_groups
  value_weight: 4.0
  exec_timeout: 6.0
  real_filler: HuggingFaceTB/smol-smoltalk # distracteurs RÉELS
  real_cap: 20000
  real_max_tok: 96
  real_cache_dir: ${TB_ROOT}/data_cache
  p_real: 0.8
  surprisal_mode: sif
  sif_a: 1.0e-04
# Variante « saturée » (à copier par-dessus le bloc ci-dessus pour muscler la
# strate des sondes IMPOSSIBLES — mesuré : ~50 % de sondes neutres) :
#   n_facts: [12, 16]
#   n_probes: [3, 4]
#   p_beyond: 0.5

rl:
  seed: 0
  train_scope: rti                         # retriever + tête de write + vecteur
                                           # de type SEULS, backbone gelé. Sous
                                           # rti la ligne `<think>` du lm_head
                                           # n'est l'action de personne (le
                                           # write est une tête dédiée) : le
                                           # learner REFUSE `think_row` à
                                           # l'assert. `all` ouvre le backbone —
                                           # pas au premier run.
  init_from: ${TB_ROOT}/checkpoints/v350_sft_recall_rti/final.pt
  n_lives_per_worker: 2
  max_episodes_per_life: 0
  cascade_depth: 0
  steps: 20                                # FUMÉE
  group_size: 8                            # les G rollouts d'un groupe partagent
                                           # UN script (recall_env.script(life))
  groups_per_step: 2
  lr: 3.0e-04
  temp: 3.0
  lambda_write: 0.0
  clip_low: 0.2
  clip_high: 0.28
  kl_coef: 1.0e-2
  min_reward_std: 1.0e-4
  max_resample: 4
  explore_floor: 0.5
  grad_clip: 1.0
  save_every: 50
  think_nmax: 16                           # économie de think NEUTRALISÉE
  think_floor: 1.0                         # (floor 1.0 ⇒ eff ≡ 1) : le FIFO
                                           # price déjà les writes.
  max_new: 96
  amp: true
  decode_cache: true
  decode_graphs: false                     # INCOMPATIBLE rti : le préfixe
                                           # injecté change la longueur du 1er
                                           # forward, les graphs sont capturés à
                                           # forme FIXE. Refus à l'assert côté
                                           # worker (jamais un désarmement muet).
  # ── L'ALGO DU LEARNER (rti_learner.py) ─────────────────────────────────────
  # Recette actée (recherche SOTA 2026-07), et NON du GRPO vanilla :
  # avantage Dr.GRPO (baseline de groupe, jamais /σ) + second niveau GiGPO
  # ancré sur l'index de tour, loss CISPO (on clippe le POIDS d'importance, pas
  # la mise à jour), crédit write contrefactuel leave-one-slot, filtrage
  # zéro-variance. Aucun terme KL : le cliquet SFT joue ce rôle ENTRE phases.
  learner:
    algo: cispo
    cispo_low: 0.0                         # r >= 0 par construction : pas de
                                           # borne basse ⇒ les actions rares
                                           # (write froid) gardent leur gradient
    cispo_high: 2.0                        # borne haute LARGE : avec
                                           # write_floor 0.5 le ratio d'un write
                                           # confiant vaut déjà ~p/0.5
    omega: 1.0                             # poids de l'avantage de TOUR
    gamma: 1.0                             # vies courtes : escompter
                                           # n'ajouterait qu'un biais de récence
    adv_scale: 1.0                         # normalisation batch-level = une
                                           # CONSTANTE (jamais une stat de
                                           # groupe : c'est le biais Dr.GRPO)
    cf_coef: 0.5                           # crédit leave-one-slot (0 = off).
                                           # Coût : 1 forward par (write, sonde)
    cf_signed: true                        # pondéré par (2·reward − 1) : un
                                           # slot qui a porté une MAUVAISE
                                           # réponse n'est pas un bon write
    cf_clip: 5.0                           # |Δ| borné (réponse vide = −40 nats)
    w_write: 1.0                           # poids des trois familles d'actions
    w_retr: 1.0
    w_dec: 1.0
    tok_norm: 0.0                          # 0 ⇒ rl.max_new. Diviseur FIXE de la
                                           # famille tokens — JAMAIS la longueur
                                           # réalisée (biais de longueur)
    drop_zero_var: true                    # groupe à reward uniforme = zéro
                                           # gradient d'épisode ⇒ jeté et compté
    keep_turn_only: true                   # …sauf s'il reste de la variance PAR
                                           # TOUR (deux rollouts qui réussissent
                                           # chacun une sonde différente)
    write_cost: 0.0                        # pénalité de coût des writes, OFF :
                                           # la FIFO price déjà l'écriture par
                                           # éviction
  disagg:
    root: ${TB_ROOT}/rl/recall_env_smoke
    publish_every: 1
    max_lag: 2
    keep_weights: 3
    poll_s: 2.0
    max_pending: 8
    lives_save_every: 20
    xdom_every: 50
    max_groups: 0

# ── LE BRAS RTI : mécanisme (RtiConfig) + ACTIONS (RtiPolicyConfig) ──────────
# Les trois actions créditées par le même reward vivent ici. `rti_policy.py` en
# porte les log-probs ; `rl_disagg.Worker.one_group_rti` déroule la vie.
rti:
  enabled: true
  top_k: 13                                # lignes natives par groupe (verdict
                                           # du jouet : plus petit k dont la
                                           # strate code dépasse 95 % de
                                           # couverture)
  max_groups: 8                            # = model.max_mem = recall_env.max_groups
  sif_a: 1.0e-02                           # 1e-2 et NON 1e-4 : mesuré au jouet,
                                           # 1e-4 écrase la strate code
  sep_token: <blank>
  train_groups: 2                          # ISOMORPHIE : train == eval ==
  eval_groups: 2                           # recall_env.inject_groups. Le
                                           # rollout ASSERTE l'égalité contre le
                                           # layout qui voyage dans le script
                                           # (r5 v1 : grade 0.067 malgré un
                                           # retriever parfait).
  train_order: oracle_first
  write_every_turn: false                  # = write_policy `facts` du générateur
  # ── les ACTIONS ────────────────────────────────────────────────────────────
  write_mode: head                         # Bernoulli apprise (tête d→1,
                                           # zéro-init ⇒ p=0.5 au step 0).
                                           # `facts` = la baseline procédurale
                                           # du SFT, bit à bit.
  write_temp: 1.0
  write_floor: 0.5                         # plancher d'EXPLORATION sur la
                                           # probabilité de COMPORTEMENT. Même
                                           # rôle que rl.explore_floor : sans
                                           # lui la banque des rollouts reste
                                           # vide et tout le groupe rend 0
                                           # (pré-vol 07-27). La log-prob
                                           # enregistrée est celle du
                                           # comportement ⇒ off-policy propre.
  write_on: all                            # tout seg est candidat au write —
                                           # y compris la réponse DÉCODÉE, dont
                                           # le groupe est construit sur le
                                           # texte réellement produit (on-policy)
  retr_temp: 1.0                           # température du Plackett-Luce
  decode_temp: 1.0                         # échantillonnage obligatoire : à
                                           # temp 0 la log-prob du token est
                                           # dégénérée, il n'y a rien à créditer
  decode_top_p: 1.0                        # le noyau renormalise la loi et
                                           # casserait la log-prob d'action
                                           # (refus à l'assert dans generate)
  greedy: false                            # true = chemin d'ÉVAL (argmax
                                           # séquentiel == top-k du SFT)

# dsv6 GRPO DÉSAGRÉGÉ 350M — cliquet RL RECALL depuis le ckpt SFT recall
# (suite du run v350_sft_recall_stair, 2026-07-29).
#
# Diagnostic d'entrée (dumps 1400/1800, held-out ET train) : canal
# Δnll-ouvert / argmax-fermé — la banque fait tenter un rappel bien formé
# (ablaté = « Noted! »), le slot accroche ~1 fois sur 2, mais la VALEUR
# décodée est un attracteur de pool (Quirinus, Quito, luthier…), jamais une
# copie depuis la banque. C'est exactement la classe de blocage que le
# cliquet RL doit débloquer : le grade exact-match (vérifiable, zéro juge)
# comme reward, l'avantage intra-groupe comme signal de copie.
#
# Deltas vs rl_disagg_350m.yaml :
#   - init_from = ckpt final du SFT recall (AJUSTER le nom au step final réel)
#   - banque FIXE 8 slots (mem_seed_slots = max_mem, décision user 07-28),
#     PAS de cascade (le SFT recall n'en a jamais vu : cascade_depth 0)
#   - envs : recall (rubrique grade_recall) + sota (pression dense de fond)
#   - le split persona = TRAIN ; le held-out reste la propriété de l'ÉVAL
#     (paliers du trainer / dump_decode) — le RL ne le voit jamais
#
# learner : python -m deepseek_v4_mini.rl_disagg learner deepseek_v4_mini/configs/rl_recall_350m.yaml
# workers : jobs ferme (voir scripts/farm/README + queue/)
tokenizer: HuggingFaceTB/SmolLM2-135M

model:                                     # = sft_recall_350m_stair verbatim
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_head: 64
  dropout: 0.0
  max_seq_len: 640
  n_hc: 2
  sinkhorn_iters: 20
  csa_m: 4
  hca_m: 16
  top_k_csa: 8
  n_win: 16
  d_latent_q: 64
  n_groups: 2
  n_experts: 4
  n_shared: 1
  top_k_experts: 2
  d_ff: 1536
  mem_dim: 512
  max_mem: 8
  mem_seed_slots: 8                        # banque = matrice fixe dès le tour 1
                                           # (comme le SFT recall : une seule
                                           # signature de graphs, éviction dès
                                           # le 1er write)
  mem_read_rank: 8
  mem_read_swiglu: true
  use_dual_stream: true
  balance_loss_weight: 1.0e-4
  decode_fuse: true                        # prérequis GraphDecodeRunner
  decode_dense_moe: true                   # (rl.decode_graphs) — inertes à
  decode_static_cache: true                # l'entraînement, prouvés bit à bit

data:
  seq_len: 512
  chunks_per_conv: 8
  defer_len: 16
  var_chunk: [128, 512]
  cache_dir: ${TB_ROOT}/data_cache
  envs:
  - name: recall                           # cible du cliquet : copie de la
    kind: recall                           # valeur depuis la banque, grade
    weight: 0.6                            # exact-match (word-boundary) x
    lambda_write: 0.0                      # économie think
    max_new: 48                            # réponse courte (« You told me your
                                           # name is X. ») — même budget que
                                           # dump_decode
    gen:
      p_smalltalk: 0.0                     # chaque épisode est notable (une
                                           # vérité plantée) — pas de contrôle
                                           # smalltalk dans le mix RL
      n_facts: [1, 3]
      n_queries: [1, 2]                    # le DERNIER query = l'épisode noté
      p_ack: 0.5
      p_update: 0.15
      p_beyond: 0.0                        # pas de question au-delà du FIFO :
                                           # la vérité y est hors banque, le
                                           # grade serait un plafond artificiel
      value_weight: 4.0
      real_filler: HuggingFaceTB/smol-smoltalk
      real_cap: 20000
      real_max_tok: 96
      p_real: 0.8                          # le filler crée la pression mémoire
                                           # (le fait vieillit dans la banque)
      real_cache_dir: ${TB_ROOT}/data_cache
      surprisal_mode: sif
      sif_a: 1.0e-04
      pool_split: train                    # held-out RÉSERVÉ à l'éval
  - name: sota                             # pression dense de fond : le chat
    kind: sota                             # général ne doit pas s'éroder
    weight: 0.4                            # pendant que le recall se muscle
    lambda_write: 0.03
    gen:
      real_cache_dir: ${TB_ROOT}/data_cache
      conv_cap: 8000
      max_turn_tok: 192
      max_conv_msgs: 10
      convs_per_session: [2, 6]
      p_requote: 0.5
      n_requote: [1, 2]
      surprisal_mode: sif
      sif_a: 1.0e-04

rl:
  seed: 0
  # think_row = l'ancre héritée du cliquet tools (post-mortem v1 : le
  # full-model RL érode le backbone). QUESTION OUVERTE pour CE cliquet :
  # think_row ne bouge que la politique write — si le motif d'écriture seul ne
  # suffit pas à faire sortir la valeur (l'attracteur est dans le décodage),
  # il faudra élargir le scope SUR VERDICT des premiers steps (reward plat =
  # élargir), pas préventivement.
  train_scope: think_row
  init_from: ${TB_ROOT}/checkpoints/v350_sft_recall_stair/final.pt
  n_lives_per_worker: 2
  max_episodes_per_life: 0
  cascade_depth: 0                         # le ckpt n'a JAMAIS vu de cascade
  steps: 1000
  group_size: 8
  groups_per_step: 4
  lr: 3.0e-04
  temp: 3.0
  lambda_write: 0.0
  clip_low: 0.2
  clip_high: 0.28
  kl_coef: 1.0e-2
  min_reward_std: 1.0e-4
  max_resample: 4
  explore_floor: 0.5                       # même amorçage à froid que tools :
                                           # le SFT n'a jamais émis <think>,
                                           # la variance intra-groupe vient de
                                           # la diversité des motifs d'écriture
  grad_clip: 1.0
  save_every: 50
  # Économie de think NEUTRALISÉE pour ce cliquet (user 07-29) : le FIFO 8
  # slots price déjà les writes (sur-écrire évince le fait à rappeler), et
  # avec explore_floor 0.5 sur des sessions à 5-16 frontières, un n_max de 8
  # aurait zéroté des rollouts POSITIFS (la ressource rare). floor 1.0 ⇒
  # eff ≡ 1 ; n_max 16 = pur garde-fou anti-runaway au-dessus du max de
  # frontières observable. Réintroduire l'économie façon MAI (pénalité
  # pondérée pass-rate) quand la copie sera ouverte.
  think_nmax: 16
  think_floor: 1.0
  max_new: 64
  amp: true
  decode_cache: true
  decode_graphs: true                      # une seule signature (banque fixe
                                           # 8 slots) : armement unique par
                                           # worker, rebind ensuite
  disagg:
    root: ${TB_ROOT}/rl/recall_350m
    publish_every: 1
    max_lag: 2
    keep_weights: 3
    poll_s: 2.0
    max_pending: 8
    lives_save_every: 20
    xdom_every: 50
    max_groups: 0

# sft_sota_fromsif_rearm — ÉTAGE 2/2 : ré-armement teacher SIF sur data SOTA.
#
# Warm restart depuis step_150 de l'étage 1 (registre payé). Schedule = la
# recette rearm validée sur persona (Δnll +0.332 @550, uniforme en âge),
# transposée aux répertoires ouverts : teacher surprisal PLEIN β=1 [0,150]
# pour graver le read sur du vrai texte, rampe 1→0 [150,300], WSD decay dès
# la fin d'anneal (300→650). Juge @450-650 à β=0 : Δnll requote par âge.
# Pendant le plateau β=1 : Δnll éval négatif = artefact connu (éval = writes
# natifs vs train = gists), santé = dist.
#
# LANCEMENT :
#   python -m deepseek_v4_mini.code_defer_native \
#     deepseek_v4_mini/configs/sft_sota_fromsif_rearm.yaml
tokenizer: HuggingFaceTB/SmolLM2-135M

model:                                     # = v350_phase1_10b (386M)
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_head: 64
  dropout: 0.0
  max_seq_len: 640
  n_hc: 2
  sinkhorn_iters: 20
  csa_m: 4
  hca_m: 16
  top_k_csa: 8
  n_win: 16
  d_latent_q: 64
  n_groups: 2
  n_experts: 4
  n_shared: 1
  top_k_experts: 2
  d_ff: 1536
  mem_dim: 512
  max_mem: 8
  mem_seed_slots: 4
  mem_read_rank: 8
  mem_read_swiglu: true
  use_dual_stream: true
  balance_loss_weight: 1.0e-4

data:
  cache_dir: ${TB_ROOT}/data_cache
  # --- identique au bloc sft_school (cache hit garanti, ancres GAP code/web)
  sources:
  - name: codeparrot
    dataset: codeparrot/codeparrot-clean
    weight: 0.20
    stream_cap: 90000
  - name: stack_c
    dataset: bigcode/the-stack-smol
    data_dir: data/c
    weight: 0.06
    min_chunks: 2
    stream_cap: 10000
  - name: stack_rust
    dataset: bigcode/the-stack-smol
    data_dir: data/rust
    weight: 0.06
    min_chunks: 2
    stream_cap: 10000
  - name: stack_js
    dataset: bigcode/the-stack-smol
    data_dir: data/javascript
    weight: 0.06
    min_chunks: 2
    stream_cap: 10000
  - name: stack_sql
    dataset: bigcode/the-stack-smol
    data_dir: data/sql
    weight: 0.04
    min_chunks: 2
    stream_cap: 10000
  - name: stack_html
    dataset: bigcode/the-stack-smol
    data_dir: data/html
    weight: 0.04
    min_chunks: 2
    stream_cap: 10000
  - name: stack_css
    dataset: bigcode/the-stack-smol
    data_dir: data/css
    weight: 0.04
    min_chunks: 2
    stream_cap: 10000
  - name: fineweb
    dataset: HuggingFaceFW/fineweb
    config_name: sample-10BT
    content_key: text
    min_chunks: 2
    weight: 0.10
    stream_cap: 250000
  - name: fineweb_edu
    dataset: HuggingFaceFW/fineweb-edu
    config_name: sample-10BT
    content_key: text
    min_chunks: 2
    weight: 0.08
    stream_cap: 250000
  - name: wikipedia
    dataset: wikimedia/wikipedia
    config_name: 20231101.en
    content_key: text
    min_chunks: 2
    weight: 0.08
    stream_cap: 60000
  - name: finemath
    dataset: HuggingFaceTB/finemath
    config_name: finemath-4plus
    content_key: text
    min_chunks: 2
    weight: 0.08
    stream_cap: 250000
  - name: khanacademy
    dataset: HuggingFaceTB/cosmopedia
    config_name: khanacademy
    content_key: text
    min_chunks: 2
    weight: 0.04
    stream_cap: 60000
  - name: openstax
    dataset: HuggingFaceTB/cosmopedia
    config_name: openstax
    content_key: text
    min_chunks: 2
    weight: 0.06
    stream_cap: 60000
  - name: arxiv
    dataset: armanc/scientific_papers
    config_name: arxiv
    content_key: article
    min_chunks: 2
    weight: 0.06
    stream_cap: 60000
  seq_len: 512
  chunks_per_conv: 8
  defer_len: 16
  batch_size: 1
  var_chunk:
  - 128
  - 512
  n_files: 6000
  stream_cap: 90000

training:
  seed: 0
  steps: 650
  grad_accum: 4
  amp: true
  # Base = étage 1 (registre payé sur data sota, teacher-off).
  # Poids seuls, optim frais, step→0. Banque fraîche.
  init_from: ${TB_ROOT}/checkpoints/v350_sft_sota_fromsif_reg/step_150.pt
  lr: 1.0e-04
  muon_lr: 2.4e-04
  muon_ref_mem_dim: 64
  warmup_steps: 0                          # LR plein dès step 1 (recette validée)
  no_reset_files: 0                        # une seule vie de banque pour tout le run
  cascade_depth: 4                         # banque complète V3
  weight_decay: 0.01
  grad_clip: 1.0
  defer_weight: 1.0
  wsd_decay: true                          # consolidation validée au rearm
  wsd_decay_start: 300                     # decay dès β=0 (fin d'anneal)
  wsd_decay_shape: linear
  grad_checkpoint: true
  gc_save_topk: false
  log_every: 1
  eval_every: 50
  eval_convs: 8
  eval_sources:
  - codeparrot
  - fineweb
  eval_depths: [2, 8]
  eval_depth_convs: 8
  eval_depth_sources:
  - codeparrot
  - fineweb
  save_every: 50
  save_dir: ${TB_ROOT}/checkpoints/v350_sft_sota_fromsif
  metrics_file: ${TB_ROOT}/runs/v350_sft_sota_fromsif/metrics.jsonl

chat:
  stream: sota_session
  p_chat: 1.0
  weight: 1.0
  eval_convs: 12
  max_new: 64                              # réponses réelles > valeurs persona
  gen:
    real_cache_dir: ${TB_ROOT}/data_cache
    conv_cap: 8000
    max_turn_tok: 192
    max_conv_msgs: 10
    convs_per_session: [2, 6]
    p_requote: 0.5
    n_requote: [1, 2]
    requote_weight: 4.0                    # run 1 (w=1.0) coupé @259 : Δnll
                                           # plat +0.05 sur 5 évals, chat 3.3→2.6,
                                           # abl grade 0.04→0.11 = registre appris
                                           # sans payer la banque ⇒ pression native
                                           # (mask = 1+(w-1)·sif, réponses requote)
    surprisal_mode: sif                    # poids SIF posés sur les segs
    sif_a: 1.0e-04                         # (teacher OFF : inertes, prêts
                                           # pour un ré-armement éventuel)

# TEACHER RÉ-ARMÉ (recette rearm persona, cible label-free)
teacher:
  enabled: true
  distill_weight: 2.0
  target: surprisal
  anneal: [150, 300]

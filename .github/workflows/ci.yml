name: ci

# Tout ce qui peut être vérifié sans GPU ni données. Les self-tests du paquet
# sont hermétiques (vérifié : cache HF vide + HF_HUB_OFFLINE=1), donc la CI ne
# télécharge aucun modèle et ne dépend pas de la disponibilité de HF.
#
# Ce qui N'EST PAS ici et reste manuel sur la 3090 : le smoke d'entraînement et
# le test de resume bit-identique (ils veulent un GPU et le cache de chunks).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # Avant l'install de torch : ces deux-là sont stdlib pur, c'est la
      # contrainte qui les garde déployables sur la VM data sans venv.
      - name: Outils de la ferme (dashboard + lecteur RL)
        run: |
          python scripts/farm/rl_status.py
          python scripts/farm/farm_dashboard.py --selftest

      - name: Dépendances (torch CPU — les tests ne touchent pas au GPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Smoke d'import (tout le paquet)
        run: python scripts/import_smoke.py

      - name: Self-tests hermétiques
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: bash scripts/selftest.sh

      - name: Configs actives valides (schéma)
        run: python -m deepseek_v4_mini.cfg_schema
